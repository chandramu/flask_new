<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Notes</title>

  <!-- iPad / iOS home-screen app settings -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Notes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1b19" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar">
      <header class="sidebar-head">
        <h1>Notes</h1>
        <button id="newBtn" class="icon-btn" aria-label="New note" title="New note">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </header>
      <div class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="Search" autocomplete="off">
      </div>
      <ul id="list" class="list"></ul>
      <p id="empty" class="empty" hidden>No notes yet. Tap + to start writing.</p>
    </aside>

    <main class="editor" id="editor">
      <header class="editor-head">
        <button id="backBtn" class="text-btn back" aria-label="Back to list">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>Notes
        </button>
        <span id="status" class="status"></span>
        <div class="actions">
          <button id="pinBtn" class="icon-btn" aria-label="Pin note" title="Pin">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 17v5M9 3h6l-1 6 4 4H6l4-4z"/></svg>
          </button>
          <button id="deleteBtn" class="icon-btn danger" aria-label="Delete note" title="Delete">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
          </button>
        </div>
      </header>
      <div id="placeholder" class="placeholder">Select a note or create a new one.</div>
      <div id="fields" class="fields" hidden>
        <p id="date" class="date"></p>
        <input id="title" class="title" placeholder="Title" autocomplete="off">
        <textarea id="body" class="body" placeholder="Start writing…"></textarea>
      </div>
    </main>
  </div>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
